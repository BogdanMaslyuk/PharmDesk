name: Windows updater syntax
on:
  push:
    paths:
      - 'update-windows.ps1'
      - 'pharmdesk.ps1'
      - 'pharmdesk.bat'
      - 'update-windows.bat'
      - 'setup-windows.bat'
      - 'start-windows.bat'
      - 'replace-inventory-windows.bat'
      - 'replace-inventory-windows.ps1'
      - '.gitattributes'
      - '.github/workflows/windows-update-syntax.yml'
  pull_request:
    paths:
      - 'update-windows.ps1'
      - 'pharmdesk.ps1'
      - 'pharmdesk.bat'
      - 'update-windows.bat'
      - 'setup-windows.bat'
      - 'start-windows.bat'
      - 'replace-inventory-windows.bat'
      - 'replace-inventory-windows.ps1'
      - '.gitattributes'
      - '.github/workflows/windows-update-syntax.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax using Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($file in @("update-windows.ps1", "pharmdesk.ps1", "replace-inventory-windows.ps1")) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Invalid PowerShell syntax: $file"
            }
            Write-Host "PowerShell 5.1 syntax OK: $file"
          }
          foreach ($file in @("update-windows.ps1", "pharmdesk.ps1")) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $file))
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
              throw "Missing UTF-8 BOM for Windows PowerShell 5.1: $file"
            }
          }
      - name: Check batch file ASCII and Windows line endings
        shell: pwsh
        run: |
          foreach ($file in @("update-windows.bat", "pharmdesk.bat", "start-windows.bat")) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $file))
            if ($bytes | Where-Object { $_ -gt 127 }) {
              throw "Windows batch wrapper must be ASCII-only: $file"
            }
            $content = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($content -notmatch "`r`n") {
              throw "Windows batch wrapper must have CRLF line endings: $file"
            }
            Write-Host "Batch file OK: $file"
          }
      - name: Ensure Git checkout is clean and batch EOL rules are correct
        shell: pwsh
        run: |
          $files = @("setup-windows.bat", "start-windows.bat", "update-windows.bat", "replace-inventory-windows.bat", "pharmdesk.bat")
          $eol = @(& git ls-files --eol -- $files)
          if ($LASTEXITCODE -ne 0 -or $eol.Count -ne $files.Count) {
            throw "Could not check tracked batch files."
          }
          foreach ($entry in $eol) {
            Write-Host $entry
            if ($entry -notmatch '^i/lf\s+w/crlf\s+attr/text eol=crlf\s+') {
              throw "Git blob/checkout line endings are inconsistent. The repository must store LF and Windows must check out CRLF."
            }
          }
          $changed = @(& git status --porcelain --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -gt 0) {
            $changed | ForEach-Object { Write-Host $_ }
            throw "Fresh Git clone contains modified tracked files."
          }
          Write-Host "Clean Git checkout verified."

