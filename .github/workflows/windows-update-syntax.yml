name: Windows updater syntax
on:
  push:
    paths:
      - 'update-windows.ps1'
      - 'update-windows.bat'
      - 'setup-windows.bat'
      - 'start-windows.bat'
      - 'replace-inventory-windows.bat'
      - 'replace-inventory-windows.ps1'
      - '.gitattributes'
      - '.github/workflows/windows-update-syntax.yml'
  pull_request:
    paths:
      - 'update-windows.ps1'
      - 'update-windows.bat'
      - 'setup-windows.bat'
      - 'start-windows.bat'
      - 'replace-inventory-windows.bat'
      - 'replace-inventory-windows.ps1'
      - '.gitattributes'
      - '.github/workflows/windows-update-syntax.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell script grammar
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "update-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "replace-inventory-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax is valid."
      - name: Check batch file ASCII and Windows line endings
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD "update-windows.bat"))
          if ($bytes | Where-Object { $_ -gt 127 }) {
            throw "Windows batch wrapper must be ASCII-only."
          }
          $content = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($content -notmatch "`r`n") {
            throw "Windows batch wrapper must have CRLF line endings."
          }
          Write-Host "Batch file format is valid."
      - name: Ensure Git checkout is clean and batch EOL rules are correct
        shell: pwsh
        run: |
          $files = @("setup-windows.bat", "start-windows.bat", "update-windows.bat", "replace-inventory-windows.bat")
          $eol = @(& git ls-files --eol -- $files)
          if ($LASTEXITCODE -ne 0 -or $eol.Count -ne $files.Count) {
            throw "Could not check tracked batch files."
          }
          foreach ($entry in $eol) {
            Write-Host $entry
            if ($entry -notmatch '^i/lf\s+w/crlf\s+attr/text eol=crlf\s+') {
              throw "Git blob/checkout line endings are inconsistent. The repository must store LF and Windows must check out CRLF."
            }
          }
          $changed = @(& git status --porcelain --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -gt 0) {
            $changed | ForEach-Object { Write-Host $_ }
            throw "Fresh Git clone contains modified tracked files."
          }
          Write-Host "Clean Git checkout verified."

