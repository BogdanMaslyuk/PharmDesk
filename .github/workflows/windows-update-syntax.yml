name: Windows updater syntax
on:
  push:
    paths:
      - 'update-windows.ps1'
      - 'pharmdesk.ps1'
      - 'pharmdesk.bat'
      - 'update-windows.bat'
      - 'setup-windows.bat'
      - 'start-windows.bat'
      - 'replace-inventory-windows.bat'
      - 'replace-inventory-windows.ps1'
      - 'control-windows.ps1'
      - 'control-windows.bat'
      - 'organize-desktop.ps1'
      - '.gitattributes'
      - '.github/workflows/windows-update-syntax.yml'
  pull_request:
    paths:
      - 'update-windows.ps1'
      - 'pharmdesk.ps1'
      - 'pharmdesk.bat'
      - 'update-windows.bat'
      - 'setup-windows.bat'
      - 'start-windows.bat'
      - 'replace-inventory-windows.bat'
      - 'replace-inventory-windows.ps1'
      - 'control-windows.ps1'
      - 'control-windows.bat'
      - 'organize-desktop.ps1'
      - '.gitattributes'
      - '.github/workflows/windows-update-syntax.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax using Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($file in @("update-windows.ps1", "pharmdesk.ps1", "replace-inventory-windows.ps1", "control-windows.ps1", "organize-desktop.ps1")) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Invalid PowerShell syntax: $file"
            }
            Write-Host "PowerShell 5.1 syntax OK: $file"
          }
          foreach ($file in @("update-windows.ps1", "pharmdesk.ps1", "control-windows.ps1", "organize-desktop.ps1")) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $file))
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
              throw "Missing UTF-8 BOM for Windows PowerShell 5.1: $file"
            }
          }
      - name: Check batch file ASCII and Windows line endings
        shell: pwsh
        run: |
          foreach ($file in @("update-windows.bat", "pharmdesk.bat", "start-windows.bat", "control-windows.bat")) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $file))
            if ($bytes | Where-Object { $_ -gt 127 }) {
              throw "Windows batch wrapper must be ASCII-only: $file"
            }
            $content = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($content -notmatch "`r`n") {
              throw "Windows batch wrapper must have CRLF line endings: $file"
            }
            Write-Host "Batch file OK: $file"
          }
      - name: Ensure Git checkout is clean and batch EOL rules are correct
        shell: pwsh
        run: |
          $files = @("setup-windows.bat", "start-windows.bat", "update-windows.bat", "replace-inventory-windows.bat", "pharmdesk.bat", "control-windows.bat")
          $eol = @(& git ls-files --eol -- $files)
          if ($LASTEXITCODE -ne 0 -or $eol.Count -ne $files.Count) {
            throw "Could not check tracked batch files."
          }
          foreach ($entry in $eol) {
            Write-Host $entry
            if ($entry -notmatch '^i/lf\s+w/crlf\s+attr/text eol=crlf\s+') {
              throw "Git blob/checkout line endings are inconsistent. The repository must store LF and Windows must check out CRLF."
            }
          }
          $changed = @(& git status --porcelain --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -gt 0) {
            $changed | ForEach-Object { Write-Host $_ }
            throw "Fresh Git clone contains modified tracked files."
          }
          Write-Host "Clean Git checkout verified."


      - name: Verify control center status and workspace preview are read-only
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\control-windows.ps1 -Action Status
          if ($LASTEXITCODE -ne 0) { throw "Control center status failed." }
          $desktop = Join-Path $env:RUNNER_TEMP "PharmDesk_workspace_preview"
          New-Item -ItemType Directory -Force -Path (Join-Path $desktop "PharmDesk-git") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $desktop "PharmDesk-main") | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\organize-desktop.ps1 -DesktopPath $desktop
          if ($LASTEXITCODE -ne 0) { throw "Workspace dry-run failed." }
          if (Test-Path (Join-Path $desktop "PharmDesk_Project")) {
            throw "Dry-run unexpectedly created files."
          }
          if (-not (Test-Path (Join-Path $desktop "PharmDesk-main"))) {
            throw "Dry-run moved or removed a legacy folder."
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke-test managed server start, health, and stop on Windows
        shell: powershell
        run: |
          & python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "venv failed" }
          & .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip failed" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\control-windows.ps1 -Action Start -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "Managed start failed." }
          try {
            $health = Invoke-RestMethod http://127.0.0.1:8000/health -TimeoutSec 5
            if ($health.version -ne "0.4.6") {
              throw "Wrong server or version: $($health.version)"
            }
            Write-Host "Real local server health OK"
          } finally {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\control-windows.ps1 -Action Stop
            if ($LASTEXITCODE -ne 0) { throw "Managed stop failed." }
          }

      - name: Verify organizer Apply preserves all legacy folders in a sandbox
        shell: powershell
        timeout-minutes: 3
        run: |
          $desktop = Join-Path $env:RUNNER_TEMP "PharmDesk_workspace_apply"
          $live = Join-Path $desktop "PharmDesk-git"
          New-Item -ItemType Directory -Force -Path (Join-Path $live ".git") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $live "app") | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $live "app\database.py"),"# test marker")
          foreach ($name in @("PharmDesk-main", "PharmDesk-git-before-fix")) {
            $path=Join-Path $desktop $name
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            [System.IO.File]::WriteAllText((Join-Path $path "keep.txt"),$name)
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\organize-desktop.ps1 -DesktopPath $desktop -Apply -Approval "ПЕРЕНЕСТИ"
          if ($LASTEXITCODE -ne 0) { throw "Workspace transfer failed." }
          $workspace=Join-Path $desktop "PharmDesk_Project"
          if (-not (Test-Path (Join-Path $workspace "PharmDesk-git\app\database.py"))) {
            throw "Canonical repository not moved."
          }
          if (-not (Test-Path (Join-Path $workspace "PharmDesk-Control.bat"))) {
            throw "Root control launcher not generated."
          }
          foreach ($name in @("PharmDesk-main", "PharmDesk-git-before-fix")) {
            if (-not (Test-Path (Join-Path $workspace "_Old_versions\$name\keep.txt"))) {
              throw "Legacy data disappeared: $name"
            }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\organize-desktop.ps1 -DesktopPath $desktop -Apply -Approval "ПЕРЕНЕСТИ"
          if ($LASTEXITCODE -ne 0) { throw "Idempotent workspace rerun failed." }
          Write-Host "Workspace relocation preserved all folders and can be rechecked."
