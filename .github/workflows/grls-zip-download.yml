name: Download official GRLS ZIP
on:
  push:
    branches: [experiment/grls-official-fetch]
    paths:
      - 'scripts/download_grls_zip.py'
      - '.github/workflows/grls-zip-download.yml'
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official ZIP and verify checksum
        run: python scripts/download_grls_zip.py
      - name: Keep official GRLS archive as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-GRLS-ZIP
          path: grls_download/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
