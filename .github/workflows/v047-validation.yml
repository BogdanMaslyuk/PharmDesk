name: PharmDesk v0.4.7 validation and safety tests
on:
  push:
    branches:
      - feature/v047-validation-safety
  pull_request:
    branches:
      - feature/v047-matching-quality
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile code
        run: python -m compileall -q app scripts tests
      - name: All synthetic regression and validation tests
        run: python -m pytest -q
